course:
  name: "{COURSE_NAME}"
  slug: "{COURSE_SLUG}"
  description_path: "./course-description.md"
  voice_guide_path: "./voice-guide.md"
  build_spec_path: "./docs/build-spec.md"
  platform: "{TARGET_PLATFORM}"
  completion_threshold: 0.75
  units: {UNIT_COUNT}

  # Optional fields, populated from course description if available
  price_usd: {PRICE_OR_NULL}
  duration_hours: {DURATION_OR_NULL}
  language: "{LANGUAGE_OR_DEFAULT}"

  # Platform-specific fields. The repo-bootstrap skill writes only the keys
  # that match the chosen platform, with a placeholder value for the user to
  # fill in. Other keys stay commented out so the file remains self-explaining.
  #
  # Canvas: choose ONE of two modes (not both).
  #
  #   Create-new mode (admin):
  #     canvas_account_id: 1   # Account ID under which to create the course.
  #                            # On hosted Canvas the root account is 1; on an
  #                            # institutional instance, ask your Canvas admin
  #                            # which sub-account ID you have rights to.
  #
  #   Update-existing mode (teacher):
  #     canvas_course_id: 12345  # Integer ID of an existing course where you
  #                              # are listed as a teacher. Find it in the URL
  #                              # when viewing the course on web:
  #                              # https://your-canvas.instructure.com/courses/12345
  #                              # The toolkit pushes content into this course
  #                              # without trying to create a new one.
  #
  # PDF:
  #   pdf_page_size: "letter"          # "letter" (default) or "a4"
  #   pdf_microsim_strategy: "qr"      # "qr" (default) or "screenshot"
  #   pdf_microsim_base_url: null      # The public URL of the course's
  #                                    # static-web companion. QR codes link to
  #                                    # <base_url>/unit-NN-microsims/<file>.
  #   pdf_include_final: false         # true to embed the course final at the
  #                                    # back of the PDF (questions only;
  #                                    # answers are hidden via CSS).
  #
  # TalentLMS:
  #   No course_id field needed. TalentLMS scopes everything to the API
  #   key's account. Set platform: "talentlms" and put TALENTLMS_API_URL
  #   and TALENTLMS_API_KEY in .env. The sync creates the course on first
  #   run and tracks the course_id in sync-state.json after that.
{PLATFORM_FIELDS}
